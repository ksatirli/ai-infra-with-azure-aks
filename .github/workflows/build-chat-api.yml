name: build-chat-api

on:
  push:
    branches: [main]
    paths: ["app/**"]
  workflow_dispatch:

# id-token: write lets the job request a GitHub OIDC token. Azure exchanges it
# for an access token because the managed identity trusts this repository's
# production environment. No Azure secret is stored in GitHub.
permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign in to Azure Container Registry
        run: az acr login --name "${{ vars.ACR_NAME }}"

      - name: Read image version
        id: version
        run: echo "version=$(cat app/VERSION)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          tags: ${{ vars.ACR_LOGIN_SERVER }}/chat-api:${{ steps.version.outputs.version }}
